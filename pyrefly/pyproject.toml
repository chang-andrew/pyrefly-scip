# The narrate-release branch packages this fork as `pyrefly-scip`: a wheel holding only the
# `pyrefly-scip` binary (pyrefly with `check --report-scip`). It has no Python module, so it never
# collides with a stock `pyrefly` installed beside it.
[build-system]
requires = ["maturin>=1.10.2,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
strip = false
include = ["rust-toolchain"]

[project.urls]
homepage = "https://github.com/chang-andrew/pyrefly-scip"

[project]
name = "pyrefly-scip"
description = "Pyrefly with a SCIP index report (`pyrefly-scip check --report-scip`)"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
